[server]
# This prototype is intentionally local-only. Do not change this to 0.0.0.0
# unless you first add authentication, TLS, authorization, and a reverse proxy.
address = "127.0.0.1"
port = 8501
headless = true
maxUploadSize = 200
maxMessageSize = 200
enableCORS = true
enableXsrfProtection = true
allowedHosts = ["localhost", "127.0.0.1"]

[browser]
serverAddress = "127.0.0.1"
gatherUsageStats = false

[client]
showErrorDetails = "none"

[theme]
base = "dark"
primaryColor = "#3DD9C4"
backgroundColor = "#0A1220"
secondaryBackgroundColor = "#111F2F"
textColor = "#EFF6FC"
